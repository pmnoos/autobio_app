# Render Blueprint for Autobiography App
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: autobio-db
    plan: basic-256mb

services:
  - type: web
    name: autobio-app
    runtime: ruby
    plan: starter
    autoDeploy: true
    buildCommand: |
      bundle install
      bundle exec rails assets:precompile
    startCommand: bundle exec puma -C config/puma.rb
    preDeployCommand: bundle exec rails db:migrate
    # postDeployCommand: bundle exec rails db:seed  # Disabled - data already exists in production
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: autobio-db
          property: connectionString
      # - key: IMPORT_CHAPTERS_ON_SEED
      #   value: "1"  # Disabled - production chapters already exist
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      - key: RAILS_SERVE_STATIC_FILES
        value: "true"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RAILS_MASTER_KEY
        # Set in Render dashboard if you use Rails credentials
        sync: false
