# PostgreSQL. Versions 9.3 and up are supported.
#   gem install pg
#
#   Ensure the PostgreSQL gem is defined in your Gemfile
#   gem "pg"
#
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: autobio_app_development
  username: postgres
  password: peter284
  host: localhost

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: autobio_app_test
  username: postgres
  password: peter284
  host: localhost

# Store production database in the storage/ directory, which by default
# is mounted as a persistent Docker volume in config/deploy.yml.
production:
  primary:
    <<: *default
    database: autobio_app_production
    username: postgres
    password: peter284
    host: localhost
  cache:
    <<: *default
    database: autobio_app_production_cache
    username: postgres
    password: peter284
    host: localhost
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: autobio_app_production_queue
    username: postgres
    password: peter284
    host: localhost
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: autobio_app_production_cable
    username: postgres
    password: peter284
    host: localhost
    migrations_paths: db/cable_migrate
